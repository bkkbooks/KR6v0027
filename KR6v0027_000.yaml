body:
  text: 法華經文外義整理者李際寧張曉娟題解法華經文外義中國僧人所撰佛教經典疏釋作者不詳一卷本文首殘尾全卷尾有尾題及題記法華經文外義一卷一校竟大統十一年歲次乙丑九月二十一日比丘惠襲於法海寺寫訖流通末代不絶也原卷啓功題籤本疏以問答的形式對鳩摩羅什譯妙法蓮華經的思想多有引申發揮由於卷首殘不得見其全貌但據文內尚存的不同層次的內題如料簡文經理經二智次明因緣燒舍宅者淨土者五百由旬險難道者次明二依十地者等可以看出本文的脈絡及作者的關注點本文對南北朝時期的中國佛教及法華經思想在中國的流傳具有重要的研究價值本文一個顯著的特點是通卷頗多口語化文字亦多通假俗寫對研究該一時期文字語言具有一定的意義文內似有數處錯簡詳情待考本文未為我國歷代經録記載亦未為歷代大藏經收録根據各敦煌文獻收藏單位公布的目録僅見上海博物館藏此一件編為號本次整理以上海古籍出版社出版之該號影印本為底本無校本録文
