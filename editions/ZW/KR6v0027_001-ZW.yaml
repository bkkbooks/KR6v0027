body:
  text: 前殘大義復云何為在相續復通實法也又解一念之善是乘而不運是火而不燒復有一解火本相續中有燒實法之中則無用也又問若實法中無用何故名火也又解熱多色等眾成故名之為火以因來解義四大類解不異也更有一解火一運中有用乘要在相續中有用又問若爾一運之火實法則有燒用之義我一念之善則有運載之義若一念之善則無乘義一運之火則無燒義也又解火是一時因成假故實中有乘是相續緣成假故相續中有用實中無也問眼識一念中有用以不又解眼識一念之中則能了別青黃也又解一念眼識攬三相相續而成此一念亦是相續緣成之假而實中有用者善亦是相續緣成假實法中亦應有乘義等是相續緣成假所以眼識一念中有了別之義善則無用也又解眼識亦相續緣成假但三相實法之位實位相續有來對境根塵相順起則了別青黃故實中有用也乘本要就假位相續故相續中有用實中無也又問根塵相順實中有用者若爾善本起則順理實中亦應有乘也又解不同起則順理實中得有善義不得有乘義也又問相續義云何又答解義不同一解前能感後前與後作因不得續名後必赴前後不絕前後念上得其續名也又問前能感後前得作後後必赴前後得作前以不又解前能感後前得作後後者正者正得赴前不得作前也何以得知金剛心感種智得與種智作因故得作種智種智赴金剛不得作金剛也所以如此金剛是因無常不滿種智是果常而滿足正以無常不滿足故得作常種智常而滿足故不得作無常不滿足也復又一解前能感後後必赴前前後相續中間得不絕之名此一絙就兩頭得名也又問攬常無常明無明成相續一問此一為是常為無常也為是明為無明也又解此一不得名常不得名無常不得名明不得名作無明正得名非常非無常非明非無明何以得知攬常成故不得名無常攬無常成故不得名常為大明成故不得名無明為無明成故不得為明也又問若攬常無常成此相續一得不名常無常者攬金剛已還無常神慮金剛已後常神慮成此相續此一得名非慮非不慮又解此一正得名大慮不得名非慮非不慮也又問若爾正應得名常也正得名大明不得名非常非無常也非明非無明又解不類常無常明無明別不通故所感一不得名常無常明無明也慮名是通所成相續一得名慮也何以得知因亦是慮果亦是慮是以所成一得名是慮不得因是無常果亦無常因是無明果亦無明以是義故正得道非常非無常非明非無明也更有一解此一亦得名常亦得名無常何以得知攬常成故從後作名名為常也為無常成故從前作名名為無常也明無明亦如此解此問攬常無常成相續一問此一二諦作判落在何諦所攝又解二諦所不攝何以得知橫截而言二諦往判唯二無一以一諦往絙始終相續唯一無二也故經言相續一實諦明義各異何相關也問何諦所攝也復有一解此一為二諦所攝也何以得知以二諦往分從後故為第一義諦所攝從前故世諦所攝又問若為二諦所攝云何道非常非無常也又答若如前解不得名常無常若依後解亦得名常亦得名無常亦得名明亦得名無明也為常所感從後故名為常也為無常所成從前故名為無常也明無明亦如此也又問此相續一慮照何境而起又答解有二種一解言照一境而起何以得知前境常無常相續一慮那得有別境可照也以是義故得言照一境也復有一解亦得緣常無常二諦理也何以得知金剛是因心不滿由常緣二諦理起豈況果心滿足而不照也此解當就後念上得續名也又問眾生作佛佛續眾生者涅槃是假以不又答諸師解義不同一解涅槃是續而非假也又問涅槃所以得置於續何故不得安假也又解續名與常相順何以得知常以不斷為義續義復是不斷二名相順是以果頭得安續名也假義與常相違何以得知涅槃是實絕於假誑假是虛偽不實二義相背故不得安假也更有一解金剛以還是續而是假金剛以後是續而非假何以得知金剛心與種智為因有赴前而感後故是續而是假也種智但有赴前而無感後之義是以續而非假也復有一解涅槃得言是相續相待假而非下地因生因成也眾生修行作佛佛得續眾生故是相續假也經言有心故所以有其當性此詎不性待於心也有如來藏故生死相續不斷此生死待如來藏也此是相待假也是以涅槃是續而是假也又問涅槃體絕百非云何是假也又答涅槃絕者絕於下地之相體絕下地之假也絕下地之非絕下地之是金剛以還百是不能是百非不能非體正是大相也體正是大非是大是也體非金剛以還生死之是故稱為非體絕金剛已還生死之非故稱為是也又問涅槃若是假應是無常又答何必是無常也何以得知如虛空結盡是相待假而非是無常涅槃假之中極非是無常也又問言無明此義云何又一解就相續道中本時行地無明闇惑之心今變作果頭大明又問明解既起斷去無明云何得相作也又解解起惑喪理不相作但明解之生沒他無明心後起道言作也更有一解明闇相連不得相作就相續道中本時無明所成續今作果頭大明所成續也續名是通得相作也故經言本時鹿王今則我身是也就寬時中本時鹿王成續今作佛續又問金剛已還離心之續金剛已後即心之續云何非心得續於心若非心得續於心金剛已還色亦應得續於心若色不得續心金剛已還非色非心者不得續於果頭心也又解續義非心義所以得相續也更有一解金剛以還有二種之續有即心續有離心續今言續者即心續續於果頭者離心續齊金剛已還謝滅不通果頭也續名是通慮亦是通得相作也常無常時明無明別不得相作也又問眾生修行作佛為當一中得佛為當異中作佛又解正眾生與佛相續一故就相續一中眾生修行得作佛也復有一解若苕然異不得作佛若冥庭一亦不作佛也正以有一有異故就一異之中眾生修行得作佛也又問乘體之義如上所論乘之齊畔竟復云何又答經論師解義各自不同一解要取性地以上善以為乘體乾慧以還非為乘體也何以得知性地以上無漏空解直感菩提運載行人必故不退此善是強得為乘體也乾慧以還退沒不定進趣無恆非為乘體也就大乘中習種性深廣心以上得為乘體自此以前非為乘體也何以得知經言世間諸善不動不出有相沈沒無相出世亡相無報也以此驗知世間善非為乘體也又問若世間善非為乘體者何以經言是乘微妙從三界出至薩婆若住復言積世間善滿得出世間善下經言低頭舉手童子壅沙一毫之善皆得成佛以此驗知有相諸善都得以為乘體云何道言世間善非為乘體也又解道言從三界出者三界善與乘為因故能遠生於乘道言從出道言積世間善滿也低頭舉手有相諸善皆得成佛者世間有相諸善能發生於乘與乘為因為緣何以得知五戒十善感得人天果起此善理數滅盡更無所感故知非正乘體也又問若世間有相諸善與乘為因為緣非正乘體者問此見諦一念惑中得與修道為因與三界外恆沙為因與無明住地作因得與處處為因今且問見諦與修道作因者此因為當屬見諦為屬修道也又解見諦與修道為因以修道果未緣屬於修道名為修道惑也又問若見諦與修道作因此因屬修道不名見諦者我世間有相諸善與出世無漏作因應屬於出世應名相善得為乘體也若世間善與出世無相作因不得屬於無相見諦與修道為因不應屬於修道名修道惑應名見諦又解不類惑本同是違理取性障解不殊為一無礙解脫所除是以見諦中為因者得名修道惑善本相無相異漏無漏別伏除有異雖與無相作因不得漏於無相得為乘體也又問乾慧以前此善為因不為乘體此事可解今問乾慧與性地為因者此因云何又解乾慧終心與性地作因者此善得言屬無相以為正乘自此以前但有資發之義非正乘也復有一解莫問有相無相但使一毫諸善皆能運載行人都得以為乘體也何以得知經言是乘微妙從三界出至薩婆若住經復言低頭舉手童子壅沙皆得成佛以此驗知都得以為乘體也若世間有相善不能運載外化凡夫乘何善來得至性地性地既不到初住乃至十住何由可階眾生從無始已來無有修行得佛者若爾法古已來無有諸佛聖人正以眾生從無始以來修善來至性地乃至十住修行作佛以此都驗故知世間有相諸善皆能運載得為乘體也又問若世間善都以為乘體者世間善有動出何以經言世間諸善不動不出有相沈沒無相出世也此解詎不違經文也又解道言相善不動不出者靈山以前不了義說為修五戒十善得人天果報屬於人天名人天乘道品等行因緣觀智屬於二乘名聲聞緣覺乘也行六波羅蜜名菩薩乘為欲彰五乘教別故道言不動不出也又來世間有相善中有二種因有遠有近近者感人天果報遠感於佛道言有相諸善不動不出者但道感人天義強感佛義弱隱他感出世義邊故道不動道理有出世義邊也雖復相無相相異同能運不殊故得為乘也道言相善進退無恆者泛論因果之道要果起則因發人天乘退退非佛乘有退也何以得知本修五戒十善情期人天修因有局果報有限是以退感佛之因大果未就為因不忘永無退理修世善未滿佛乘義弱遇緣則退若修世間滿佛乘強者乘此善故永無退也又問上來所論佛法理中所修諸善得為乘體也未量外道修禪伏結所修諸善得為乘不又人解言不得為乘也何以得知外道修善情標別趣是以不得為乘也又問若就情期不得為乘者修五戒十善亦情期人天二乘修道品等行因緣觀智情期灰身涅槃以為究竟又解若當就情期二俱情有所標若當就理皆應有感佛之義所以人天二乘所修諸善獨得為乘外道所修諸善所以不得為乘也以如斯往伏不見有解今且依一師解意存前解也就理論乘不就情期也何以得知本修五戒十善道品觀智論情各有所期理而言之皆有感佛之義是以道言汝等所行是菩薩道故知不就情也就理得為乘也又問若當就理為乘不就情期者何由得有內外之別也又解論五戒十善非不情有所期但以順佛教生善故不名外道外道修禪伏結生在非想起於斷常不依佛教而生故名外道雖內外有異皆有遠感之義莫非是乘也又問道義乘義有何等異有一解道亦相續運通乘亦相續運載也論其能都在相續不異也更有一解有異道停而通物乘是相續運載故所以有異也何以得知道是停而通物一念之解能除相續之結故知實中有用乘本要攬前後善相續得有運載之義假中有用故知二義有異也又問上來所解因乘粗可如此果乘之義竟復云何又答諸師解義不同又一解果頭無乘義何以得知唯有因中不足境中有進趣運載得有乘義果頭滿足更無進趣無有乘義也何以得知勝鬘經言得究竟法身者於上更無說一乘法事若果頭有乘義應道說一乘法事正以經言更無說一乘法事故知果頭無有乘也又問若果頭無乘義者一乘章末言一乘者即第一義乘此為是因乘為果乘也又答一乘者即第一義乘第一義諦能發生於乘此是緣中說乘也又問若作此解果頭無乘義者若爾唯因中不足境中有惡可防得有戒義果頭無惡可防無有戒義因中有苦可代得有樂義果頭無苦可代無有樂義如是類難萬義可知果頭無乘復無戒義常樂義若爾唯因中得有萬義果頭無也云何經言大涅槃體備萬義也如此之難云何可解此解難存也又一解果頭有乘義果體滿足雖無進趣得此滿足之理能運度蒼生下接解乘義也復有一解運載行人代苦得樂名之為乘如似世人乘於車馬代於馳驟之苦萬善相續載行人離苦得樂名為乘也因中代苦不極猶尚得有乘義果頭代苦之極特得乘義也是以果頭亦得有乘義又問代苦得樂解乘義者代無常得常亦得解乘義以不若代無常得常不得解乘義者代苦得樂亦不得解乘也我淨亦爾類難不異也又答代無常得常亦得解乘義無我得我不淨得淨都得解乘義也何以得知苦以逼切為義樂以適悅為能乘以運載為義苦樂義非是乘義而得解乘義常以不遷為義無常以遷流為義乘以運載為義常無常亦非乘義何以不得解乘義也以此驗知代無常得常無我得我不淨得淨都得解乘義也又問若都得解乘義者何以不道代無常得常無我得我不淨得淨乃道苦樂也又答苦樂是眾生報之主分報之精功由苦樂又來但舉於果不通於因且就顯處語無常義漫通於因果不淨義亦爾彰乘義不顯故不道也更有一解代苦得樂不解乘義運載解乘義但乘義於善惡無由取別將代苦得樂來欲標善惡乘別何以得知運載行人代樂得苦以知不善乘運載行人代苦得樂以知是善乘也以是義故得知善惡乘別也復有一解運載解乘義因中不足境中進趣運載解於因乘果頭運載之極解於果乘也何以得知如人乘車遠來至家停住雖無有去由故名為車來到果頭雖無進趣但運載極故由故得名善能運也以是義故果頭得有乘義也又問因果乘同能運載何由取別又答因中進趣運載解於因乘論果頭也運載物解於果乘所以有別也因中行者何由不墜落三途良由有乘可乘故行者不墜不沒也果頭行者何由湛然常住正以有乘可乘故以無常窮極之善運無窮行者是以湛然常住又問果頭運載之極得有乘義止惡之極得有戒義者若爾果頭止惡之極應名大護何故名為三不護也又答因中止惡不極事須三業防護果頭止惡極故不須防護故得不護之名也又問能乘所乘何以得知又答如似車是能載人是所載也更有一解人能柄法人是御乘之人善是所乘之法又問乘既如此一義復云何又答一解一義唯在於果不通於因何以得知大果無二可得名一因中參差不得為一唯果頭得一名因中無也更有一解因雖萬差同感一果始終相續運義不殊名為一因果雖有萬義差別同是滿足訓因義不殊名為一果故經言因無異趣果無別從天下道理唯有一因一果是以乘通因果一亦通因果故言一乘也料簡文經理經又問唯取能詮為經所詮亦是經也又答解義不同一解言唯取能詮為經不取所詮也何以得知若取所詮為經何由得有三寶體別能詮佛文是經所詮佛事復是經能詮僧文是經所詮僧事復是經若爾唯一法寶以是義故無有三寶異也今明三寶歷然故知所詮非經也又來若取所詮為經者經言狐狼野干不淨等物豈可是經若是經者煞狐狼野干應得煞法寶之罪今煞狐狼野干不得煞法寶之罪以是義故所詮前事體非是經也又復涅槃經七善中言知十二部經名為知法是其能詮前理名為知義是其所詮若取所詮為經者何由得有七善體別便應正有六善又來四無礙中初明達於能詮名為法無礙知於所詮以為義無礙若以所詮為經唯有三無礙不應有四也四依中言以能詮之教以為初依教下所詮之理以為第三依若取所詮為經何由得有四依義別正應唯三無四今時正以有四依義殊四無礙體別七善有異以此眾驗故知唯取能詮為經不取所詮也復又一解能詮所詮俱皆為經也何以得知經言泥洹是真法寶理處精高益物中勝故知理為經也如人不識月以指指月欲使尋指以得月若論先識者栖於月上何用指為教亦如是正以耳目之徒不達於理聖人佈教萬差正欲使行者尋教得理若能同於法身以上冥心會理豈復假此粗教及其會理要必亡詮夫聖人設教之來正欲引汲不逮之流是故說以名相名相既陳道在方寸故知教是接俗之近詮非是至聖環中之妙旨論其理益物之本法寶中精棄本以存末何異宋氏之守株又復涅槃經言正以經之威力便令夢睹羅剎墮於地獄加怖發心永隔闡提故知所詮為經也若當唯文為經不取理者昔日三乘經亦是金口所說名字句為體今涅槃經亦是名字句色法以之為體也等是其文有何所以昔日對文不能發菩提道心今日對文能發菩提道心故知由二常之理察機分明應感而作能使夢睹羅剎地獄加怖發心故知正是理之能也又來復言卿若遲晚者對文不悟復以理加怖發心故言自往以此來驗故知所詮是其經也又復下六念中言三世諸佛同有秘密之藏迦葉菩薩因即發問若三世諸佛同有秘密之義迦葉佛時有是經不如來答言有迦葉復問迦葉佛法七日便滅云何有也如來答言但爾時眾生利根但假四依七日流通七日以後不假文經理行於心文經雖滅理經常存若理非是經何故道理經不滅故知文理俱皆為經也又來復驗若理非是經下經言此法華經藏深固幽遠無人能到欲明理深幽遠唯佛獨究十地不逮若但以文為經讀誦得者便到何故道人無能到十住不詣以此驗知理為經也又問若以理為經者唯一法寶何由得有三寶體別又答據理而言唯一法寶就法寶中離出佛僧因中除僧果頭除佛二諦有為無為都是法寶以是義故三寶有別也又問若以理為經者狐狼野干不淨諸物是所詮前事都應是經也又答都是所詮前事就事中有精有粗精者是事而是經粗者是事而非經也凡經文自有宗途若論昔經以空為宗二諦理精得以為經餘者是事而非經也向引狐狼野干不淨物者是事而非經何以得知為鈍根人故不能深識其患故借世物事以沈無明煩惱濁亂其心不堪聞大是以施三引此物事正為廣釋施三之意何關理事故知非經耶若論事別不同皆是其事下經言一大事者此是一乘之事事之中精者是事而是經也又問若以理為經者何由得七善義別正應有六善又來正應有三無礙不應有四也正應有三依則無有四又答夫聖人說法為物故作或合或離彼中為欲彰七善義別文之以理分為二善此中道經者是總文理合為一也為欲彰四無礙義別四依體異故能詮所詮分為二也又解十二部經唯校於文經首之經文理通為經也何以得知從如是卒至歡欣奉行直說語言名修多羅理非語言故知唯在於文妙法蓮華經涅槃經此是經首之經文理通是也更有一解莫問十二部經經首經文理通為經也又問解義唯一更有異釋又答解義不同非唯一種也又一解經者是逕此法逕由聖心之所由履亦稱為經又問若爾金口所說可名為經餘四種人所說云何得名經也又解雖非金口所說為聖述成逕由聖述亦得名經佛去世後諸弟子造論不為聖述不在經例也又復解言經之言由三乘聖人由之得道故曰經也又復解言經者是徑如世間徑路通人遠遊之詣法亦如是由履此徑遠之佛果故名徑路也更有一解經者常也雖復古今有殊而覺道不改三世諸佛履之不變恆為益物故曰常也又問修多羅可翻以不又答不可翻也如似涅槃含萬羅漢比丘各含於三修多羅含五皆是總意不可翻也別意可翻何以得知總不可翻別名可翻也就胡音自有總別能喚於萬總別斯收此間漢地發言是別但能喚別不能一音喚於萬故知不翻也別名可翻如胡言般若秦言是智此相收得盡得論翻也又問若修多羅不可翻何以經言直說語言名修多羅若爾語言翻修多羅云何不翻也又答修多羅體是語言非是語言翻修多羅也又問若依百論胡音名修多羅漢言經本若爾經本翻修多羅也又答修多羅體中有此本義故道言本也何以得知語言以本不翻修多羅本以出生為義語言以詮談法相為義修多羅以五為義何關本事如似柱體上有方圓義何關解柱義柱以𣚰為義正以修多羅體上有此出生義故道言本本義實不翻修多羅也修多羅更無別義解五義盡即是解修多羅義也如涅槃更無別義解萬義周盡即解涅槃義也又問修多羅含五所以修以常名𨲙修多羅處又答解有二種一解常義是萇觀通於五所以代也何以得知是萇或能流潤或不能流潤非真涌泉正以備有常義成故萇能流潤是真涌泉故知是萇也或能莊嚴或不能者非真華鬘正以備有常義故萇能莊嚴餘義類解異也更有一解常義一在五義之外彷彿似總云何似總五義是別修多羅是總總別有異得言總在別外經復是五義之外故常名代修多羅處也復有一解若依論解語言翻修多羅何以得知涅槃七善中言始從如是終至歡喜奉行名修多羅復道直說語言名修多羅以此來驗故知語言翻修多羅胡音名修多羅秦言直說語言若作此解以何為修多羅義胡音何以名修多羅詮談前理名修多羅義此間漢地何以名直說語言詮談法相名為語言義也以是義故得論翻也又問若以語言翻修多羅者何以道修多羅含其五義也又答若寧馨解時修多羅不道含五也但修多羅體中有此五義不以五義解修多羅義也如似陰體有無常義無常義不解陰義修多羅體上有無量義但道於五義如似涅槃體有萬義略列三事法身般若解脫可以知萬以此來驗略道於五可以知萬也更有一解若依百論解本翻修多羅何以得知胡音名修多羅此間漢地名為經本胡何以名修多羅能出生十一部名修多羅義此間漢地何以名經本出生十一部名之為本雖復名異義同故知正相翻也又問若以經本翻修多羅者何故經言直說語言名修多羅又答經言直說語言者出修多羅體故知不以語言翻修多羅也又問文理俱皆為經者所詮之理是善可解能詮之文是如來口業亦是善以不又答解有二種一解言能詮之文是如來口業亦是其善也問能詮之文是名字句為音聲性成是其色法體是頑礙云何是善又答即返質問無作體亦是頑法而是善惡論其經是如來口業是其善竟復何慊經復言三業供養故知口業是善也更有一解音聲所成名字句體是色法是其無記為過因所得復是頑法故知非善非惡然是口業能通善惡名為善惡體非善惡也然經道三業供養者因中說果故言善惡身業亦然又問若爾者善惡無作體是頑法亦應非是善惡也又答不類何以得知雖復同由意地而發然而有異身口業善心亦能作動惡亦能發動無記心亦能作動三性通者驗無可求論其無作不爾要善心能發惡亦發無記之心不能發於善惡無作故知有異也無作體正是善惡復有一事一發常有何以得知要心發得要心即謝無作終身而勝鬘經言我從今日乃至菩提於所受戒不起犯心此身遷流無常論其無作恒存不滅修縱萇短皆由善惡心有寧馨異故故知無作體是善惡不類身口如似揮刀奪命詎得名刀為善惡也遠近雖異同是無記動轉諸業三性通有不同無作也又問若善惡唯心不在於色色以質礙為義心以能緣為義善以順理為義惡以違理為義始卒同類善惡義非是心義云何善惡唯在意地不在身口也又答法相有通有塞經言即意是意業如似無記之心無記義非心義得言即心無記無記體即是心也善惡義雖非心義得言善惡體即是也故經言心為天堂心為地獄故知善惡正在於心不在於色也二智二智者權實雙明稱之為二決判分明故名為智大聖一念靈解照萬境朗然何限於二但府就化宜略判有二其二者何實智方便智但就經教明二智各自不同若就昔經明空有二智者第一義空絕於假誑名之為實緣此實理而起名實智世諦假誑不實名為方便緣此假誑理起名為方便智也此解二智皆從境得名也更有一解實智從境得名方便智就功能得稱何以得知世諦華薄誑凡眼目生人染著之心聖慮高解照而不著故得巧之名是以方便智就情得稱也空理是實實智緣實理而生故知實智一向從境得名也又問世諦華薄凡應生著照而無染得巧之名故就情得名者我第一義空生患處深聖者照而不著亦應得巧之名若爾實智亦就功能得名云何實智從境方便智就情又答二諦皆能生患但世諦生患處重又來是生惑根本於此世諦生患根本處照而不染故是以得巧之名第一義空生患處薄正以禪脫因緣流浪至於空上又來生惑之末從多故不得巧名也依維摩經明二智復異直緣二諦理起實智所照緣巧智所為者方便智照也如似借坐燈王室苞乾像大小相容修縱萇短香積取餐緣如斯之者是方便智境方便智境小隱難見空如空而緣有如有而緣大如大而照小如小而照如似須彌極大芥子絕小如大小而緣故是實智所緣也小能容大作如斯照者是方便智境實智從境得名方便智就功能得稱也依涅槃經明二智復異二常之理絕於百非稱之為實緣此實理而起故稱實智金剛已還生滅流動假誑不實稱為方便緣此方便理起名為方便智也又問金剛以後有性空何智所緣又答果頭有性空故是方便智所緣也更有一解果頭無性空何以得知果體凝然常住不可空乃問何智所緣也又問果頭有互無何智緣也又答果頭有二種互無何以得知涅槃中無二十五有二十五有中無涅槃此無不成涅槃落在世諦為方便智所緣也復一種互無成涅槃涅槃體非二十五有此無即成涅槃二十五有體非涅槃此無即成二十五有若寧馨解時果頭互無為實智所照也如牛中無馬此無馬之無不關於牛牛體非馬此無即成於牛也昔日性空二諦今常住二諦往判落在世諦為方便智照也又問若道第一義空落在世諦者第一義空絕於假誑名之為實若爾方便智亦緣實理而起云何一向道言方便智所緣故名方便也又解有中參差不等空理均精是一從多故道言緣方便亦有緣實也又來世諦萬有是空之詮就詮語故道言緣方便名方便智也今此法華明復異也一乘絕於三虛名實緣此實理起名為實智三乘之教無而說有稱方便緣此三教而起稱為方便智也若作此解法華明二智極狹更有一解緣一乘緣一理起及以乘之境界皆是實智所緣緣五乘之教丈六如來猿猴鹿馬權智所為者是方便智所緣也若依後解法華明二智極寬何以得知莫問昔日空有二諦常住二諦皆能發生於乘故知寬也又問得智名云何又答二智得名各自不同實智從境得名方便智就情得稱何以得知方之言善便之言巧正以善巧故能權施三教教是色法若為得論巧也正如人善知作車人巧故善知作車可得名車為巧得巧之名人上得目也以此驗知方便就情得名實智一向從境也又問二智緣境云何又答二智皆緣境起若不緣境時知名是何物智如似有木在山臥地不知名作何木亦有巧匠繩默揣握名某都盡智亦如此以境來彰智得有萬智差別也緣黃故名為黃智緣青故名為青智餘萬境類可知也以此驗知緣一故名為實智緣三故名為方便智也又問方便之義唯有一種更有異也又答方便有多種自有前道方便自有誑相方便有進趣方便復有善巧方便也又問此經明何等方便也又答此經大意明進趣及以善巧何以得知引汲小心趣向大理故知是其進趣方便能使無而說有權假施三良由巧故所以能爾故知是其善巧方便也又問三乘方便聖者無而說有惑情不達執以為實若爾以往實無小機云何得言稱機說法又答實如所問本來無其小機正是一大乘機根但就大乘機根中自有強弱差別不同自有感六度之機有感十二因緣機有感四諦之機但小情念果機非是情但情上有此機義今時以念來約得言稱機說法也何以得知以聲聞念來約四諦機得言稱機說四諦以緣覺念來約十二因緣機得言稱機說十二也以菩薩念來約此六度機故得言稱機說六度又問緣一故名為實智緣三故名為方便智者今問聖智靈解照時為知本來有三可照為知本來無三可照也答聖智照時知本來無三可照何以得知此三曲遂物情故所以有非是道理有之以此來驗知本來無也又問若聖照知本無三者云何緣三故名為方便也又答聖智知本來無三但三乘人所念有三究竟緣他三乘人所念有三究竟邊故得言有三可照也又問三乘人所念三究竟心為是惑是解也又答是其惑心非是解也又問三乘人念三究竟以為惑者如來能緣之心亦應是惑也何以得知如來知本來無三緣他三乘人所念有三得言有三可照三乘人所念有三既是惑心如來能緣之心那得非惑也如似邪見人謗無三寶四諦此緣無之心是其邪見如來今緣他邪見所緣無如來能緣之心亦應是邪見也又答不得作如此難也何以得知如來緣三反照己智即知此三非三是以如來能緣之心是其解非是惑也三乘緣三不能反照己解即知此三非三是以三乘執三究竟是其惑非是解也邪見之難亦如此解如來緣邪見所緣無反照己智即知此無非無是以如來能緣之心是解非是邪見邪見之人不能反照己解即知此無非無是以是其邪見非是解也又問三乘人執三究竟心為是惑為是非惑也又答解者不同又一解言是其相善何以得知三寶四諦虛假不實凡情不達執為定實此是相善以此來驗緣實三究竟此亦是一相善也復有一解執三之心一向是不善何以得知道理有三寶四諦於此上計定實心是其相善道理無三妄執為三究竟無三究竟可以當心故知一向不善也又問三乘同執為斷結處齊為當有異也又答二乘根鈍要斷三界結盡然後方覺菩薩根利但布位至習種向也而不斷結但三乘習菩薩行同在習種性中也又問此經明二智唯有一種更有異也又答若作無常解但有一種二智若作常解有二種二智安樂以來明其因乘緣此因乘名為實智緣三乘虛教名為方便智也踴出已下緣壽量常果名為實智緣金剛已還生滅理起名為方便智也若如此解與涅槃同然復小異涅槃緣二常理起名為實智此經緣於現果報不明當性故所以異也更有一解此經明二智苕然與涅槃異何以得知異也經教宗徒各自不同涅槃二常為宗常無常兩判此經以一乘為綱不以常無常兩別明義既不同故知除患亦異靈山以前空有以相對涅槃常無常以相對此經一三以相對昔經所以空有以相對者正以眾生不達萬法虛假計為定性是以如來為說空有二諦明世諦因緣故有實義故無破眾生計性之患故空有以相對也所以涅槃常無常以相對者正以眾生八倒在懷金剛已還有漏法中妄計神我以為常樂我淨以此邪倒在懷故是以如來為說金剛以還苦空無常除彼常樂我淨倒也於無為法中妄計苦空無常倒在懷故是以如來為說金剛以後常住湛然第一義諦除彼苦空無常倒也是以常無常以相對也今日此經所以一三以相對正以三乘眾生執己所得以為究竟是以如來顯明一乘是實三乘是虛破除眾生對三之患是以一三以相對也以是除患不同明義有別故所以異也然涅槃緣金剛以後名為實智金剛以還名為方便智今日此經明一乘乘通因果莫問因之以果但使緣一乘理起名為實智緣五乘教起丈六如來猿猴鹿馬名為方便智也又問此經具有二智以不又答他人有一種解此經不具二智何以得知昔日施三但有方便智無實智今日破三無三但有實智無方便智也又問若爾如來二智不具足也若道昔日施三但有方便無實智昔日但言是實不道方便要今日顯大彰昔是權得稱方便昔時不得道方便亦無方便智今日時破三無三但有實智無方便者問今日時中聖智緣此像正法中三乘教何智所緣解言是方便智所緣也若爾云何破三無三無方便智也又來縱使破三無三緣三世諸佛三乘教復是何智所緣故是方便智所緣也以此來驗云何道今時破三無三無方便智也更又一解如來道王樹下時二智雙然並有乃可就教中顯有難易有顯不顯也何以得知如來無始不緣三權三無始不緣三為一緣三權三方便智照緣三為一是實智所照也故知如來二智恒並有未曾暫廢也又問智之以慧為同緣一境為有異緣也又答依經教明義各自不同若依昔經緣空為慧緣有為智復有一解緣空亦得名智亦得名為慧也何以得知決了名智觀達名慧於二諦理決了分明名之為智觀達二諦理原名之為慧若爾二智皆同緣二諦境起也依如前解法華涅槃緣境有異也若依後解涅槃法華智慧緣境不異也次明因緣又問因緣之義為當一體義殊為當別體義異也又答諸師解義各自不同有一解言萬善強而辨果名之為因萬善弱而助發名之為緣若作此解因緣別體也更有一解因緣一體萬善無而能變當佛果此是親故名之為因也可有當佛道理故萬善能變若晝無當果道理萬善何由能變是以無而能變說之為因可有而有說之為緣若作此解因緣一體而義異也如似胡麻中道理有油故後時人功搗押能使出油道理無油頗能使有油如似沙中無油縱使人功搗押頗能出油也永無許理也又問無而能變名為因者為當變無作有為當變有作有也又答故是變有作有若無善惡因時當果晝無如似二頭三手龜毛兔角此是畢竟無不可變使有也正以有一念善因起變果在當也是以故變有作有非是變無作有也復有一解現在善惡能親而變果名之為因此因不固流動過去迴曾因以之為緣未有善惡因時當果晝然有因故果在當親故說之為因果已在當要須曾因扶故果體顯現故說曾因以之為緣也到指現現時因以為曾因以之為當是以張寫為言更有一解無而能變目之為因此因體即有疏而助發名為緣一體之中具有因緣義也又問因緣之義粗可如此因緣齊畔竟復云何又答諸師解義各自不同依如先舊宿德解初一念善感佛義不足要萬善備感佛義圓滿如似眾系繫象初一系不能制象要多系能制象也又問初善感佛義不足眾善感佛義滿者若爾佛果有優劣何以得知果頭萬義有其勝如在前感者不滿為不如在後感者滿足以為勝也豈非勝如也又答若作萬善為緣因佛性為正因可有許理何以如此萬善是緣緣有強弱正因恆滿也若作萬善作正因此解難存也復有一解無始以來曾起一念善以為正因自爾以來既至金剛所修諸善皆為緣也更有一解從無始以來卒至金剛就大寬時中束為一因感佛義圓滿但因不頓發要須次第而起也始從習種終至金剛起因盡故種智現前也復有一解最後金剛一念善心感佛果圓滿得為因義自此以前感佛義不滿足但相資發都名為緣也故經言漸漸積功德具足大悲心也又問金剛以前但次第緣發無有因義者若爾見諦惑中不應得與修道為因復不應與三界外恆沙無明住地為因若言見諦得與處處惑為因復感苦樂之果我解中何不得與處處解為因復與佛為因也又答明義不同惑本從粗以至細故得與處處為因解本從微至著故但有次第發起之義無有越感不得為因也告諸聲聞眾及求緣覺乘者又問略說中何等人於中得解又答解義不同一解略說中有三菩薩利根辟支於中得解何以得知略說中文略義隱自非利根何由得解故知利根於中得解也更有一解此中無有緣覺之人何以得知經中道言譬如彗星夜現時人以為不祥之相辟支出世亦復如是有此人時無有佛出有佛時無有此人云何道言緣覺於略說中得悟此事謬也何以得知此中無有此人得悟三根人得理在懷要先領解聖與授記何以如此但二乘諸人從昔以來對教情重要須破教執心則喪惑心既除得勝理在懷其必領解若當領解聖應授記何以得知如似舍利弗廣說得解譬喻品初領解後聖與授記四大聲聞於火宅得悟窮子領解後聖與授記下根人亦如此三根得解要須領解授記此中若有此人得解應有領解受記今時一不見領解二不見受記以此事來驗故知二乘於略說不解廣說方悟也又問若爾菩薩得勝理在懷亦應有領解受記何故經不道又解大品座上已與別記分明今更不復受記菩薩利根執心處薄但得理在懷不須領解也又問若當無中乘人聖者徒設此中乘之教竟有何益又解聖者非無有益但中乘有二種人一緣覺緣覺二聲聞緣覺今但有聲聞緣覺無緣覺緣覺又問若無彼人今何故經中道及求緣覺乘又解今時座上有此仰習辟支人故道及求緣覺乘也又問假設有辟支山中獨悟竟然後值佛出世欲使並當此人置在何許又答此人昔日在聞思慧中本願無佛出世因緣獨悟既有此願心願心既強縱使有此人不來佛邊聽法也又問若爾畢竟可不解大乘也又答今時雖不悟盡此報身未來世中餘方淨土中值佛得聞大乘必能解悟也從初住既至六地感聲聞得悟皆是聲聞地七地已上不復假教名辟支佛地也但使聞音聲得解都名聲聞就聲聞中更作累名菩薩本曠兼天下就行析名緣覺利根從境得目也聲聞根鈍存其本稱也又問未知何者是緣覺何者是聲聞又答事亦難知身子利根在先得道應是緣覺人何以得知緣覺根利在先得悟今時舍利弗法說得解故知是緣覺人也又復舍利弗目連在外道法中與沙然為弟子沙然去世後以五百弟子委付目連舍利弗為我匠令成就如來知彼根熟時至遣阿鞞比丘往化汝今日入城乞食值一非常之人應略為說法舍利弗朝樓上觀看見阿鞞比丘持鉢挾錫威儀詳序來入城乞食此人既有如斯威儀必有好師我當往問是以即問阿鞞比丘汝既有如斯威儀必有好師師為是誰阿鞞比丘即答吾師天中天舍利弗言我師亦天中天乃至拔斷十二根舍利弗聞道拔斷十二根此人解悟外道但能伏不能斷也是以問阿鞞比丘為我說法比丘謙讓我年既幼稚學日有初淺何能宣至真如來廣大義舍利弗問何以名沙門阿鞞比丘為解一切諸法本因緣空無主息心達本原故號為沙門舍利弗於是悟解即成初果後來至佛邊佛為說法道成羅漢聞道因緣空無主復聞道拔斷十二根正是十二因緣以此驗知舍利弗應是緣覺人也舍利弗既緣覺還來為目連說復得初果後得羅漢故知目連亦是緣覺人也迦旃延亦是緣覺何以得知以藥來驗病迦旃延計常十二因緣本為除斷常二見以此驗知是緣覺人也唯有迦葉一人經有成文王舍城中為大迦葉具說十二因緣也故知是緣覺人也更一解舍利弗是聲聞人何以得知經道言舍利弗等於小涅槃而般涅槃緣覺之人於中涅槃而般涅槃若是緣覺人經何以不道於中涅槃而般涅槃以此驗知舍利弗定是聲聞人其餘者未可定判也菩薩中有三根上根者於無量義座上得解中根人略說得悟解下根者於廣說與身子同解緣覺中亦有三根利根者於廣說中解中根火宅得悟下根微弱假化城然後方解聲聞亦有三根上根廣說得解中根火宅得解下根者正假化城微末生解未能迥灼要得記分明方能得解也若二若三者又一解若二者無聲聞緣覺若三者無菩薩三乘都破何以得知就道理之中唯有平等大乘萬善得佛何處別修六度行得佛以此驗知三教都破也道言修六度得佛者亦是方便說也下經言十方世界中尚無二乘何況有三者天下道理尚無聲聞緣覺乘何況菩薩乘也下偈中經文亦如此解更有一解若三教都破違下經文何以得知下經文言唯此一事實餘二則非真若當三教都破應道餘三非真也下窮子領解中密遣二人若三教都破應道密遣三人乃至化城中息處故說二若三都破應道息處說三也以此三處經文來驗故知但破二乘教不破菩薩何以得知但破二乘不破菩薩也明聲聞二乘情標別趣對果心重常行捨心不欲化物是以患由教生要須破教執果情息然後迴心向於大理故須破教菩薩本執心處微今言破者但破執心正以昔日道言我獨成佛聲聞不得有此存大之心是以須破也不破於教也何以得知菩薩修六度行道理作佛教中復言向佛今若破菩薩教更向何路以是驗知但破二乘不破獨大也菩薩乃可行有廣略初始機根微弱不堪聞大備修萬行但說六度進德遠標佛果然後機根成就為說萬行得佛道品等行雖復理中向佛教中不道得佛是虛今日破使向佛以是義故但破執心不破於教若爾何故言破三本道理唯一大乘就一上施二通本數故所以有三今言破三者破三之名數故言破三也又言五濁故施三本為五濁眾生一上施二通本數故道言施三今既遣其二何處有三故下經言無二亦無三也今言分一為三者分何等一以為三乘若論果體真實理無優劣不可得分就因乘解有深淺優劣不同得論分於一乘以為三乘也合三為一者本正是一大乘行今就教中分道品等行以為聲聞因因緣觀智以為緣覺因六度等行以為菩薩因分一因以為三因今時合三為一者合三因以為一因本有三果可為三因所尅今既破無果三因竟何所尅是以合三因以為一向佛因也今言理中無三者若就昔經第一義空理中無三者若就今經一乘以為第一義諦三乘以為世諦今言理中無三者一乘第一義理中無有三乘也又問破三歸一者歸何等一也為歸果一為歸因一又一解歸於因一也何以得知本分一因以為三因今時破三歸一破三因以為一因故知歸因一也復有一解歸於果一也何以得知本三因向於三果以為究竟今三果既無更有歸趣唯有一果故知歸於果一也又問二乘生患竟在何處又解良由佛教而生也又問佛教竟有何偽而致生惑也又解佛教言近而意遠是以二乘執近而乖遠故致生惑又問聖教偽在何處又解聖教但道斷三界惑盡身亡智喪有為苦盡無為涅槃以為大樂更不道有當法身而續是以二乘從凡向聖修行得果情期最後身盡無為以為大樂執為究竟生患故稱偽也又問此對果之心為是惑為是解也又解是惑心也又問若是惑者云何惑復能斷惑也又解初執果之心是惑從此心後修道品等行是其解心通前道故得言是惑就後也得言是解所以能斷惑也是以解能斷惑非是惑能斷惑也又問二乘執果之心既言是惑未識為是何惑也為是三界中惑為是三界外惑也又解此惑不定隨凡聖有異若外凡夫貪心執教此外凡惑若內凡執教是內凡惑若三果執教是三界思惟惑若羅漢執教是三界外惑何以如此三學已還未斷三界惑盡是以執教是三界內惑羅漢見諦思惟惑盡故由有執果之心是三界外惑也又問起惑既如此今聞大乘得斷此惑以不又答諸師解義不同又一解今聞大乘但伏使不起不能永斷也何以得知三乘被破今修菩薩行乃在習種性中若當聞大乘但使斷三界外一毫惑者後修行得登七住時增其勝解結應更斷三界外惑盡若爾便應在前成佛八住已上何須一阿僧祇劫行行方登正覺以如斯來驗故知三學及羅漢聞大乘但言伏也又問今聞大乘但能伏者何處時方得斷也又答斷惑自有次第不可越也若依大乘斷惑極自難知以小乘來准無望可以得知小乘經中燸頂以來伏惑無相已上永斷者准於大乘中住前伏惑不起初住已上作無相行以為永斷也何以得知涅槃經中是人出世具煩惱性故知住前伏惑不斷也復有一解言生空以上得一毫空解在懷永斷煩惱乾慧地中伏惑不起也若寧馨解時燸頂以來方斷三界外凡見諦惑盡從無相以上斷三界內凡見諦惑盡道成須陀洹果以此來類大乘中住前性地解行斷外凡見諦惑盡習種性中但能伏惑不能永斷也初住以上斷內凡惑也初住斷欲界內凡惑盡二住斷色界內凡惑盡三地斷無色界內凡惑盡名須陀洹菩薩四住斷欲界思惟五住斷色界思惟六住斷無色界思惟名斯陀含菩薩七住八住斷欲界習九住斷色界習盡名阿那含菩薩十住斷無色界惑盡名羅漢菩薩諸佛斷萬惑斯盡名大阿羅漢也依大乘斷結粗可如此今二乘執教生患修行得登何處也若外凡執教惑修行得登性地解行地住前得斷盡也內凡執教惑修菩薩行得登初住乃至三住以來方斷盡也三果執教惑修行得登四住至六住以來得斷盡若羅漢執教惑修行得登七住以上方得斷也更有一解二乘人三果四向及羅漢執教今聞大乘得論斷也不得論伏又問若爾還指前解成難結應在前成道也又解藥病相當非不斷也一毫執有之患解空則遣對三之惑解一則遣理數相違何由可背但三界外惑細而難遣要多劫修行方得斷除也三界惑粗容有頓遣何以得知聲聞一形修道道成羅漢故知容有頓遣也是以二乘始從習種訖七住以來但修有中諸行得登八住斷結處齊無有前後也又問經言下下智斷上上煩惱上上智斷下下煩惱今二乘人習菩薩行乃在習種性中後七心中安今問此習種菩薩何如性地以上乃至六住菩薩智六住菩薩正斷三界四住惑盡習種菩薩不如百千倍校云何乃斷三界外細惑以此格量何由可解後解難立也又人解破聲聞無聲聞亦無四諦破緣覺無緣覺亦無十二因緣若爾境界亦無云何涅槃座上故具明四諦十二因緣以此來類此解難存有一解破有所以華嚴座上為大根大行頓明一切法相說四諦十二因緣是菩薩境界道品等行因緣觀智六度諸行是菩薩加行滅結無為菩薩滅諦四果之名是菩薩之果名五戒十善皆得於佛為菩薩頓明一切法相得作根本法輪漸教中四階說法廣他華嚴座上以為條末後為聲聞小行不堪聞說深理割四諦十二因緣屬二乘境界道品等行因緣觀智屬二乘觀行滅結無為以為二乘寂滅諦四果之名割屬二乘析果之名五戒十善得人天樂果是以四乘諸人順教修行各有所得如來三十年中說空宗般若等經柔伏其心長養道機今始成就今時靈山中還伏流明義屬在菩薩故言破三五濁者名雖有五語體有三煩惱以見及以命濁據神慮為體眾生非色非心為區劫濁不定一解以色為體復有一解通於色心及以非色非心斯皆為體也何以得知劫是其寬餘四是別道劫通權於四也如似時方要就法以辨時方通於色心非色非心萬法莫非是時方亦如此也以此來驗就濁以辨劫不就劫以明濁故知劫是寬故通於四也餘四是狹不通於劫也又復解言劫非是濁劫中有此濁事道劫為濁眾生亦爾非是其濁以濁法成於眾生名眾生為濁也又問五濁煩惱障何處解為當但障大乘解亦障小乘解又解大小乘解俱障也但障有近遠五濁煩惱近障小乘解遠障大乘道也又問大小俱障何以得說於小不得說大又解小乘理淺惑粗乾慧解想伏除故所以得說生解斷除大乘理深要須善強惑薄方能取悟正由眾生失解起惑五濁在懷惑重垢深翳障大解不得說故今時斷粗惑以盡解強惑弱方得說也又問五濁大小俱障者為是事障為是性障也又解小乘初道但有事障無有性障也第三無礙解脫以後有事有性大乘解亦有事性也又人解障常之解唯事無性小乘解事性俱有依如一家不存此解也又問以何為事性也又解事性無定有解言八禪之定以之為事性空之理稱之為性亂惑障定以為事惑煩惱障理名為性惑也又復一解現起紛紜稱之為事過未冥伏不起目之為性又問五濁是其障三濁可見劫以眾生云何是障又解亦得論障煩惱以見乃至於命此之三濁是煩惱障也眾生是其報障劫是時節障也亦應道業障經文略故不道也又復解言唯有三濁是障餘二非障也何以得知非障攬此濁法以成眾生名眾生濁眾生非濁也煩惱是障以障法成於眾生名眾生障眾生非障也劫亦如此也又問更以異方便者破人天與二乘何異又一解破二乘無二乘破人天無人天四乘都齊今時有一解破人天異二乘人天因果道理有之修五戒十善是人天因因果都是其實就此一相一向非虛何故道虛明一念善中有其二感昔日但道招人天報是實不道向佛邊是虛是以人天因果亦實亦虛二乘一向是虛果既不實因解那得是實是以二乘因果俱皆是虛也又問若人天因果道理有之是實不道向佛邊虛明二乘亦然盡無生智三界惑盡報身盡處無為名為滅諦亦實有之不道向佛邊是虛若爾亦有是實云何二乘一向是虛又解人天因果道理有之因果俱皆是實道理有此二乘因果道品等行盡無生智滅結無為四果之名菩薩家觀行二乘何處有此以此來驗知二乘一向是虛人天因果有實有虛以是義故破人天異於二乘也燒舍宅者道根者夫為世間舍以蔭覆為義宅以安身之處有漏五陰能蔭覆行者喻若於舍道根栖託之處喻若於宅世間身命一形中貴道根出世中勝喻身命道根軀命寄在蔭形宅中也以何為道根王子時曾聞法華得生大乘想解能伏除煩惱名之為道復能發生後善名之為根指道作根故稱道根也此想解變今日無漏名之為因能感今日教亦名感也能與今日無漏作其基圴亦名為機也此解可貴名之為珠也從王子以來所修諸善有其強弱強善發於勝道下善發於弱道雖復強弱有異皆能發生後解都得為道根今時何故但道王子時者但王子是發解之初為因義成不可改更是以但道始也道理但使發道皆得為根也煩惱能燒燃善根喻若於火道根是所燒煩惱是能燒所燒有二種能燒亦有二種所燒二者一是蔭身二是道根能燒二者一舊二新何者為舊何者為新舊者是九十八使煩惱新火者大邪見斷善根舊火但燒蔭身不傷道根新火亦燒道根亦燒蔭身也又問何處火以為舊火何處以為新火也解有二種一解王子以來其人近出以前以為舊火其人近出以來既至鹿野以為新火也又問舊火但燒陰身不燒道根其人近出以來既至鹿野以前此亦燒道根以不解言不燒道根要鹿野中起大邪見火喪王子時為因義故得燒也又問若爾等不傷道根何故一得舊名一與新稱又解等不傷道根但其人近出以前機根微弱未可是名是故起惑但與舊稱從其人近出以來一應出世教修諸微善資助道根漸增中間起惑鄰近道根與其新名故言道隆則魔盛也正以道根強故煩惱熾也更有一解但使燒陰身火者以為舊火燒道根火者以為新也要今日鹿野中起大邪見火燒喪王子因義不感果道不續得論新火夫為世間火本能焚燒物有改變之義名之為火諸結煩惱及以重邪見能改利為鈍改好為醜能令神明昏昧得有改變之義故名為燒夫為燒斷之法要舉相續道中得有燒斷也若論實法道中王子時一念解心當體自滅惑心自生不名為燒要就相續道中能改利為鈍改好為醜能使神明昏昧有改變之義名之為燒斷也復有一解能燒據實法所燒就相續能斷就一念所斷要舉相續道中也又問若實法中有燒斷者經中何故言實法道中無燒無斷也又解經言無燒無斷者就前所燒所斷法中就實道之中終不可得燒斷也論王子時大乘想解現前莫問粗細之惑一切皆伏邪見是惑中之重唯有王子時解之力強故共相對治能伏大邪見使令不起其餘諸使煩惱非重對治是以從王子以來得起九十八使煩惱修五戒十善伏也又問依如斷結來驗上上智斷下下煩惱正應王子時大乘解伏九十八使輕微煩惱五戒十善應伏大邪見重惑不起今時王子勝解伏其粗惑自爾以來修諸微善是弱伏於細惑也若爾豈可不違斷結義也又解伏惑不同理解斷事中相違使伏如似曠劫以來修得乾慧想解現在一身中粗惑不起發得生空之解解起則能斷除何以得知事中相違便伏不同理解斷也如戒律中第一遍罪粗而易斷愍心懺悔然後方除九十事波逸提惑細而難除對手便遣此是伏惑非是理解斷時要從粗至細也以此驗知王子時大乘解伏大邪見火不起自爾以來修五戒十善伏九十八使輕微煩惱也王子時大乘一念想解永伏大邪見火不起自爾以來故起九十八使輕微煩惱也何以得知如涅槃經中正以二常威力能使夢睹羅剎墮於地獄發菩提道心生毛孔信永隔闡提唯除闡提經力所不及論毛孔信人與今日繫珠人相似皆能伏邪見不起唯起三種惡四重五逆謗方等經正不作闡提也論其闡提位人雖在現不起大邪見皆名闡提所以得知此人成就邪見因果已成當成皆在闡提位中也縱使十身五身不起大邪見非是伏故不起根鈍不起不同毛孔信人伏故不起也後迦葉中明恆河七人各自當位處別第一名常沒人第二暫出還沒是其繫珠人常沒者起大邪見不免闡提暫出還沒者雖復遇惡知識不起大邪見永隔闡提正是王子時繫珠人也何以得知下合言正旨舍利弗等諸聲聞是以此驗知王子大乘解伏大邪見不起也又問王子時大乘想解為當永伏為當暫伏也又解解有二種一解永伏不起何以得知大聖含慈何曾不欲救拔物苦與眾生樂何有驗道之際聖不救接今言起者假設之言假設聖不救接容有起理也更有一解暫伏非是永伏王子時大乘解伏大邪見勢力正至今時若聖不救接大邪見必起喪王子因義斷善根成闡提永輪生死無有出期也何以得知王子時大乘想解為因義成伏邪見果雖不起為因猶存背王子失解以來流浪生死或時起九十八使煩惱或時修五戒十善伏番覆迭起起九十八使煩惱資助邪見因熾修五戒十善資助道根義增既至今日鹿野中二力正停凡聖交際在於今時若遭遇良緣得道成聖若值惡知識必起大邪見火喪滅道根也何以得知下經言或當墮落為火所燒故知暫伏也非是永也明今時何以不起此人修善來久積集想解神機爽利從六師受學習之不難未逕幾時已習得彼法如是遍學六師都不得道既求理不得即便生謗若有聖道我應得之我今不得故知無有聖道即謗無因果起大邪見何但遇惡知識起謗縱使聖為良緣說不應機亦起大邪見故上經言若但讚佛乘眾生沒在苦破法不信故墜墮三惡道也以是故知非永伏也如來玄知畔齊乘機救接得無漏空解斷除邪見粗細俱盡也又問永伏永斷有何等異又解永名雖同然而有異永伏者雖復不起因果不除永斷者喪滅因果也如似以大石蓋其小草永無生理由有根株不去喻於永伏撥石卻根永無生性喻若永斷也就經文中何者燒陰身火何者是燒道根火焚燒舍宅者此舍以為大火所燒宜時疾出此是舊火燒於陰身也長者見是大火或當墮落為火所燒我及諸子若不時出必為火焚但令諸子得免火難此是新火燒道根也舊火已起新火未起也即脫瓔珞者一師解意為利根人樹王下見為中根人法身城中見為下根人王子來見正由見有遠近彰根有利鈍上火宅中為中根人說法見患四思惟盡在法身城中事要法身中說之方法一一叩機相應竟非形無以通化捨真妙法身應為丈六法身精妙若似瓔珞細濡上服丈六色根是粗望如法身若似粗弊之衣上來至此皆領法身中事今明即脫瓔珞捨真妙法身現丈六之容樹王成道自此已下都領應道中事若爾違上經文第二思惟言驚入火宅第三思惟言具告諸子乃至具陳上事何故有此經文若言盡在法身城中法身城中絕於言相那得言有具告陳說又解經文若言驚入火宅具告陳說者將入故名入法身城中作告說方法故言具告陳說也若言為利根人言一應見者經言諸佛唯以大事出世復言以五濁故出世以知所從來遠云何道言一應見也今一師不如此解依上經文第二思惟言驚入火宅復言我始坐道場以此來驗故知三根人見患起悲盡在法身城中第二思惟已下皆是應跡中事今四大聲聞如理而解還領法身城中見患起悲第二思惟乃至第四思惟理中教領樹王下事口告為說領鹿野中事若爾今言即脫瓔珞者捨丈六之身現老比丘同形以勸進何以得知王舍城中有三億人一億人見如來丈六形有一億人見如來老比丘復有一億人見如來默聚良由眾生感悟不同或見盧舍那佛如為瞿師羅現三尺形如斯非一正由感有濃淡致令見有精粗故知捨丈六之形作老比丘也正以聲聞懈怠不勤修道是以現作老比丘同習小乘勸進修道進行逾猛十二年中有如斯事今日解故是以通領今四大聲聞所領作何等法身解一師解十二年中但謂悉達太子六年苦行人中實成正以丈六為真到三十年中明義漸深道六十小劫行菩薩行報身中得一切種智大品以後知有法身能為應本但作菩薩為本應為丈六意謂如似彌勒一生人中成道今因經中亦作此解三根授記皆作菩薩身為本應為華光至踴出中略說一周明成佛來遠得此常住一切種智故知菩薩應身中方始得也何以得知應身成道若法身成佛無形無相於物無益為益物故菩薩發願人中成佛應身中得一切種智上玄談四句真常為本下明伽耶娑婆是得常處所若爾上經文言佛眼觀復言諸佛出世若菩薩法身為本應為丈六者何以不道菩薩眼觀菩薩出世以此驗知非是菩薩法身為本今一師解意不爾大品以前所解不異大品中言我不以此身名為佛以一切種智名為佛明義以顯自大品以後至維摩座上知有法身為本應為丈六何以得知佛身者即法身也從戒定慧解脫生又言佛身無為不墮諸數非方不離方一解言虛盡環中不在方俯應六道不離方復問八住以上不思議大士有真妙法身能為無方之應現作魔王者多不思議解脫菩薩意謂大聖亦當如是到今法華座上因經之中聞道諸佛出世而生三界驚入火宅尋此經文知有佛法身能為應本三根授記解知佛法身為本應為華光凡論授記要就應跡道中得有受記真處冥寞不論記也應跡道粗得有記也為作常法身為作無常法身解意道理正是真常法身為本應為丈六何以得知維摩中以漏照明常何況法華座上而不明常也但聲聞習無常教來久猶作生滅法身解意謂同八住以上菩薩法身也若爾菩薩法身佛法身竟有何異又解八住以上結習未盡未能具足清淨如來結習覆亡具足清淨雖具足不具足異生滅處同故知三根人決定知有佛法身為本也又問今因經中三根人領解作生滅無常法身者生滅無常解心是其惑道之心下如來云何藥草述成也又解四大聲聞昔來不達二乘是權對以為實今日因經中既明理無二三計實心亡方領如來二萬佛所化導功德善得其宜故知如來述成也無常上作無常解此是惑心是以聖者不述也復有一解以義來分取法身上還作法身解故如來述成作生滅解邊所以不述成也更有一解迦葉是權行大士何不栖心常住是故今者但述迦葉也何以得知此品中長行及偈皆是迦葉語故知述迦葉也今踴出中還非前解何有人中會得常佛今論理數成佛從初發心廣修諸行得登七住斷三界惑盡絕其分段粗形八住已上大無生相續訖至金剛終心修因備滿照理周盡金剛心謝爾時會得常佛爾時無形無相十住不逮此是理數成佛何有人中得也既得此真常為本應在樹王現成正覺下經言初得菩提者明應成佛爾時教化踴出從我發心若爾踴出中生疑者如來實成知法身為本能為丈六但事中不達意謂今日伽耶成道化爾許踴出菩薩三根人事中不達是故執跡生疑也更有一解三根聖人於中不疑也凡夫八部於中生疑如來實成踴出菩薩從其發心何以得知凡夫八部生疑下壽量中言汝等天人修羅皆謂今日釋迦娑婆成道者非是故知是凡夫八部生疑也有疾自知者疾者是死寂緣世人將欲死故先現其疾三乘丈六何由廢正由機感盡所以廢是以機根與如來為疾也機根漸成以之為疾機根轉著名為死也昔日王子一發之善為因自爾以來修諸微善資助機根轉著鹿野之中得說三乘等教藉此三乘無漏資助根機轉熾得說法華大乘因此一乘之解資助根機最熾雙林之中得說涅槃始終相續一機根今言疾者大品座上機根漸成將廢權不久喻若疾時亦機根轉著廢三乘丈六喻如死時更有一解三乘機大乘機別也有多種因自有次第相感招邊自有越義也昔日王子一發之善有與鹿苑之中為因與靈山之中為因有與雙林之中為因今道大品座上三乘機根將盡大乘漸增喻若疾時亦靈山之中三乘機盡大乘機根著廢其權教名為死時故道三乘丈六盡在此經言權盡於三說今言盡化城者就終處語亦應言實顯於三說但不道實邊也身權盡於壽量道言盡者非是事盡故言盡但識權盡故言盡也身權盡於壽量者識身權盡故言盡非謂滅身也亦應身實顯於壽量道理都應雙明今時但道權邊不道實此盡為當惑上得名為當解上得其盡稱也若論惑上置盡者三乘丈六是實皆是惑心聞法說一周身子一人雖得除遣中下二根計實之心猶未得除不與盡名要聞三周說法三根之人計實心盡方與盡名到踴出中略明常住大士雖復於先領悟始行未解猶執丈六是實不與盡名為說壽量廣明法身常住解知丈六是權計實心盡方得盡名依此一解盡名置在惑上若論置在解上三根識權盡聞法說一周身子一人雖解權盡中下未悟不與盡名要三周說法竟三根盡解權盡故方與盡名到踴出中略說一周大士利根於先解悟小行未解不與盡名為說壽量解法身常住丈六是權利鈍同解方得盡名又問因經之中以知有法身識身權分明何以不與盡稱要壽量中方與盡名又解因經之中雖復識知身權大意正明於言權不欲明於身權舉身權來為欲明言權也是以不與盡稱要踴出已下顯明常果方與盡名復有一解因經中雖知有法身但作生滅之解未識真本所以達應不明不與盡稱要踴出已下顯常住法身識真故能達應分明故得盡稱也淨土者眾生純修善業報得七珍體性光潔名之為淨安身置形目之為土論其土雖眾不出於二一是圓應變化淨土二是實報淨土也圓應者眾生感悟不同應見淨者應為淨土感見穢者應為穢土故經言或現作僮僕或復作風火國師及大臣以有利眾生故知應為淨穢也經言我淨土不毀而眾見燒者道圓應淨土也變土者欲明大聖眾生悟緣不同受道有異應見變土得益者聖人即以神力變穢為淨亦得隱穢彰淨隨物改變變者守質改形異於本色名之為變隱穢者如來神力以足指案地隱穢顯淨非是變土也化者無而忽有稱為化也就實報中有四種第一純淨第二純穢第三半淨半穢第四淨多穢少穢多淨少第一純淨者欲明眾生修彼淨土業時其善純精更無惡間所得之土純是精妙不為沙礫所雜名之為淨以此淨色安身置形目之為土第二明其純穢者欲明眾生不修善業唯是其惡更無善間所感之土唯是土石鄙惡既不為淨間純穢以此粗色安身置形以之為土第三半淨半穢修業之時善惡並有因既不均所感之土半淨半穢四淨多穢少穢多淨少者過去修因之時善業是強不善業弱所感之土淨多穢少修業之時惡業是強善業微弱所感得土穢多淨少四土論眾生實因所得變土非眾生實因而得何以得知大聖知眾生應悟淨穢以受道者如來神力能變穢顯淨亦能隱淨彰穢是以得知非眾生實報之土就實報土中大意不過有二第一明異質而同處二者一質而異見何者是異質而同處論淨穢二土皆遍三千淨土亦遍三千穢土亦遍三千此是異質而同處土本形礙俱遍三千而不相妨礙欲明眾生果報不可思議如似阿鼻無間地獄一人受苦身亦遍滿多人在中身亦不小一人在中身亦不大俱遍阿鼻而不相妨礙罪業不可思議若爾阿鼻地獄粗惡果報猶尚不相妨礙何況淨穢俱遍三千精粗同處而有妨礙故知眾生業力不可思議第二一質而異見者眾生造業有共有別共業因緣同在一質別業因緣淨穢有異自有感見而從用者自有感見而不從用者若修業之時善業力強感見淨色感而有用不善業弱者雖感見穢而無用若不善業強感見穢色感而有用善業弱者亦復如是彼見穢者即我之淨我見淨者即彼之穢我用淨時發彼之穢彼用穢時發我之淨若二業均等用即共用不用即置正由業有強弱用為興廢此一質見異者難解也土雖有四不過此二論土果可爾其因云何經言十善是菩薩淨土三十七品是菩薩淨土故知道品等行皆感得淨土他人非此解解言三十七品無漏感得淨土得此淨土為當是無漏為是有漏若因是無漏所感之土亦是無漏不因既是無漏所感之土那得非無漏經言無漏自在不繫云何感得有漏果報他人以此為妨更作異解欲明三十七品是無漏若為感於無情若非淨土因何故經言三十七品是菩薩淨土解言經道三十七品感得淨土者實非淨土因但以修此三十七品得彼常住法身故能應為淨土有如斯緣由之義故言道品感得淨土由無漏故感得淨土無漏實不感淨土若爾以何為淨土因正以十善為淨土因何處人修此淨土因欲明性地已上內凡修淨土因經言聖人畢故不造新云何修淨土之行今言修土者性地以前外凡夫修淨土因欲明外凡夫中所修精勝十善感彼淨土性地已上一切不造淨土之因此是一家解淨土今論經師不存此解向難言三十七品是無漏因既得是無漏所感之土哪得非無漏寧馨難者若為五戒十善感得人天因既是善所感之果亦是善不五戒十善悉是其善所感人天果報果是無記非是其善三十七品雖是無漏所感之土非無漏竟有何患君家不解經意道三十七品便是無漏所得淨土亦是無漏自有是無漏者自有非無漏者經中道言三十七品感得土者非是一人修住前性地解行亦修道品初住已上亦修道品雖同修道品等行有其勝如是以今道無漏不感淨土時初住以上真空無漏唯感常住不招淨土何以得知經言聖人畢故不造新何由修真無漏感於淨土是以涅槃後迦葉問言世間第一法相似相續生何以不為道品如來答言世第一法是世間心不免相間與無漏不相似故不名道品以此來驗故知三十七品有其勝如始從外凡終訖解行都名世間非真道品所得無漏非真無漏但是名字相似而已故知初住已上所修三十七品是勝真為道品是以今言聖人不造新者正是初住已上不造淨土之行今論修淨土行何處人修淨土因欲明此土精勝住前三十心人所修諸善亦感得淨土論其成就淨土之行要性地已上方始得成如人造立舍宅依空依有舍宅得成若一向依空不得成舍一向依有亦不得成要須依空依有舍宅得成修淨土行亦然若一向處有同於凡夫一向處空則同聲聞處有淨土行不成處空亦不得成是以五不求中但念空無相無作成眾生淨國土都無忻樂故知空中亦不得成今明修淨土行要須空有並修進不同聲聞一向處空退不同凡夫一向處有要藉空解道達有中行成假空藉有淨土行成是以經言三十七品是菩薩淨土若論解之深淺修業強弱所感之土階降不等逐解而言乃有階差今但就前三十心約略束為三品若論習種性中相心尤重善業微弱所感之土最是不如性地以上相心漸薄所修業勝感彼淨土次勝於前名之為中論其解行相心轉得微薄所修諸行增明於前所感淨土最是其勝故得上名正由相有輕重業有精粗致令有其優劣階降不同若論六住以還報身未亡要須假土而居問七住以上及以諸佛為有土不又人解言菩薩亦有土諸佛亦有土何以得知經自成言妙色湛然常安隱不隨時節劫數遷既有其色那得無土欲明佛身精妙之色所感之土純是精妙土中最勝以此淨色安置身形目之為土經言大火所燒時我此土安隱諸佛猶尚有土何況菩薩不假土而居故知菩薩亦有土也今時不存此解六住以還猶有父母報身可假土而居七住菩薩斷三界惑盡無父母報身唯有法身無其色根何處假土而居欲明四禪地人猶尚患色聲煩求於無色豈況大聖由假土而居君家不解經文聞道妙色湛然便謂法身為土可居凡解色法顯現故名色若論下地青黃顯現可見故名為色論其佛地何處有此青黃可論果頭萬惑斯盡眾德普備靈智顯現義同於色他人見經文道因無常色獲得常色受想行識亦得如是意謂果頭有其五陰果頭何處猶有識識是無記想是無記若論下地識本對色想取假名向言果頭有受想行識義中解作欲明大聖究竟之果無實而不知義若於識無假而不達義同於想果頭至極大樂義若於受法身正是大善行中之極名之為行果頭有萬德故一一義解故道佛地有受想行識論其大聖靈智獨存何處有此受想行識可論故知果頭亦無其色那得有土若爾何故經言菩薩佛土解意欲明眾生修淨土行要由諸佛菩薩教化方能修淨土行眾生既有淨土感得諸佛菩薩在中施化若爾此之淨土由聖化故有從化主作名故菩薩佛土理實則無淨土名教粗略如此五百由旬險難道者此中還與法說經文作喻上為利根說於五濁正以五濁在懷濁亂其心不得說大為中根借火宅為喻正以火宅之難故以三車汲引此為鈍根人借險道喻正以險道長遠故須施三中息上法說中道言諸佛火宅中借長者為喻此中名為導師上言三乘火宅中引三車為喻此中名為化城上為利根明破三歸一為中根借大車為喻今為下根明其滅化為三根說法雖借事有異皆大意為明煩惱在懷濁亂其心不得說大然今解以何為五百一種解以五道為五百何以得知三界內生死粗重煩惱亦粗能與假名行人作其留難三界外變易生死苦輕怖畏處微無明住地惑細力能自斷不與假名人為留難是故但與三界內為喻不與三界外為喻依此一種解義今言曠絕無人者無無漏聖人何以得知無漏本不繫屬三界六住以還非不有分段報形本不以分段果報以為聖人要得無漏者名為聖人是故今言天人中無無漏聖人下言過三途在人天中施二乘言教何以得知三途報障非受道之器諸龍雖復受持一日之戒一形之中終不得道是以施二乘言教要在人天是故今言五百者但與五道為喻更有一解若言三界外變易苦微不能與假名人作留難故不須道為據有識為據凡夫無識若論無識凡夫雖遭大苦不以為患若論有識無相以上深識行苦經言聖人覺苦如𥇒入目又言阿羅漢怖畏生死如人執劍欲來害己云何言變易生死怖畏處微又復言無明惑細力能自除故不須道何以經言下下智斷上上煩惱上上智斷下下煩惱要當上智能斷細惑下智能遣粗結者云何言三界外惑細不能與假名人為留難經言無明住地其力最大聲聞辟支所不能斷唯佛菩提智方能得斷那得言道惑細力能自斷若言三界惑粗能與假名人作留難故須道電光之人一入空觀摧三界結斷之不難云何言三界惑粗能與假名人為留難又復一事若以五道為五百者經言若有多眾欲過此道至珍寶處本王子時一發大解情標佛果常可情期過五道而已若當情期過於五道於聲聞行何異聲聞之人本亦情標出於三界今雖道成羅漢去佛果故喻遼喻遠經言阿羅漢二萬劫到到何處到於性地若道成羅漢竟二萬劫中修行方始到性地故知去佛果喻遼喻遠又言若情期過於五道何由得彰中息之義今明險道長遠難可越度欲明生死路遙菩薩勇猛情標佛果一往欲越度生死不論中息聲聞疲極之人情無遠標不欲一往遠涉夷途是以於其中路說二乘涅槃彰中息義顯又言至珍寶處何者為珍寶處豈可以二乘涅槃為珍寶處故知正以佛果為珍寶處欲表生死長遠聲聞懈怠不能越度要須化城中息又來何以得知三界外變易無明通以為險道是以今言五百者正以三界為三百七住二乘同斷三界惑盡束為一百八住以上終至金剛此一段生死復束為一百以為五百他人難言若當險道終盡金剛者上法說中有其五濁為中根引火宅為喻此之二種亦通三界外不若當不通有何所以為鈍根人說法偏明其遠解者言良有所以上為身子先以法相道理明義然後舉五濁者釋三之所以正以五濁在懷濁亂其心故一上作三解五濁是施三因緣是以不通三界外惑非是施三因緣不能一上作三解那得相決為中根借火宅喻但明能燒道根復能燒陰身以之為火三界外惑不燒道根火本能燒改變名之為火三界惑粗障解處重能改利為鈍喻若於火三界外惑非不障解乘理不明不能改利為鈍是故不得名為火也今為鈍人借險道為喻欲明險道長遠從始發心終於金剛三大阿僧祇修行方始得佛欲明生死路遠聲聞疲極不能越度要須化城中息又復言眾又清淨無有三界粗濁翳障名為清淨若義通三界外云何得道眾又清淨何以得知火不通經言三界無安猶如火宅復言見諸子等安隱得出到無畏處若火通三界外正是可怖可畏云何道言到無畏處今者險道何以知通經文但言既得止息無復疲倦即滅化城不言無復險道若以三界為險道何以不道無復險道即滅化城故知險道通三界外經文前後明義不同今為下根要須借道路遠事宜彰於遠若道三界為險道未足表險難長遠欲明生死路遙難可越度菩薩勇猛一往越度生死不論中息聲聞疲極之人不能一往越度要須化城若當道近何由得彰中息之義是以為彰中息義顯事須道更有一解上為中上二根其人根利但說三界火宅五濁不得說一以能知遠三界外亦是五濁曰火宅也今為下根說法異正以其人根鈍要說遠處方能得解是以金剛以還通為險道也為下根人喻說小異不同中上也曠絕無人者初住已上終至金剛乃有塵沙聖人何故言無人凡解人義識古知今施恩報德名之為人今解人要達古今理盡得名為人欲明金剛以還雖有施恩報德識古今理不盡經言十住菩薩但知其終不達其始人義不滿不與人名如來道備先登居宗體極三達靈智識古今理盡人義備滿方得人名是以今言無人者金剛已還無有滿足之人故言無人下言過三百者二乘涅槃標果不屬三界故言過也下言無水草者金剛以還無有佛果無漏故言無水草也三界外無明何由得起正以三界中作因故得起何以得知凡為惑本乃自無量略舉其對不過有四重之惑也外凡見諦澈通三界內凡見諦亦通三界思惟煩惱復澈通三界三界外習惑無明復通三界又問三界外無明何由得通三界也又解良由三界中為因故所以起故道通也三界外凡見諦一念三毒中還與外凡同種類作因復與三界內凡作因復與三界思惟作因復得與三界外恆沙無明作因略道粗處中間可知也粗惑中得與細為因細中不得與粗作因也何以得知粗惑得與細作因若外凡惑不與內凡惑為因者斷外凡惑盡此內凡惑何由得生若內凡惑不與修道作因此修道煩惱云何得起正由外凡與內凡作因內凡復與修道為因是以內凡惑修道煩惱得生也三界外習惑作因義顯可知也復所以得知外凡遠與修道為因有一人入空觀斷內凡見諦惑盡道成初果出空觀復不得起內凡煩惱修道惑何從而生也何以得知外凡惑遠與三界外恆沙無明作因從初住至六住斷三界惑盡若不與作因三界外惑何由得有今斷三界惑盡由有彼惑在故知粗中與細作因也何以得知細惑不得與粗為因內凡人斷外凡惑盡不見有起外凡惑者不見有修道以上得起內凡夫惑也復不見八住已上人起三界思惟惑也以是驗知細不與粗為因也三毒煩惱不得交互為因也故經言無明住地惑精細難除要佛菩提智方能斷盡以此驗知三界外恆沙無明變易生死都得以為險道也又人解細與粗為因三界外無明住地惑與恆沙為因又與四住煩惱作因正由無明作因故恆沙四住得起也何以得知三界外有識窟從此識窟中出流來入三界漸漸起粗造善惡業起四住之惑然後入三途受苦既為眾苦所剪方始罷苦樂求涅槃方始修道斷除也故經言大地壞故草木隨喪無明以為大地恆沙四住依無明而生以為草木斷無明根本盡恆沙四住一切皆盡故言大地壞故草木喪也此解難解依如一家不存此解存於前解粗與細為因也若粗與細為因者以何為大地草木因以為大地果以為草木因本能生於果三界四住中萬處無明因以之為地萬處中無明果以為草木也果依因住名為住地故言道大地壞故草木隨喪也依如不作流來解者如斯解經文也次明二依漸教之初所以法為四依今漸教之終人為四依也有二種解一解言昔日苦空無常理淺但能依法自能會理不須依人也今時大乘理深要須由人解釋方能得解是故人為四依也復有一解昔日三乘經不了義教但道法為四依道理人亦可依何以得知昔經勸依知法人依止和上阿闍利以此驗知人亦可依也但道依法者勸依法以取人也昔日四依者第一依法莫依於人如來去世後四依隱化無有真人可仗唯有偽人人本巧偽多端則不可依也佛去世後唯有金口所說真法在世法是鏗定則是可依故勸依法莫依於人也又來人去理遠法去理近故勸依近而去遠是以勸依法莫依人也但說依法莫依於人利根者別解第一即通解後三如似外書舉一隅則三隅返問一以知十又問通解法用云何又答聖人但道依法莫依人即能思惟此法有了不了懼畏人傳則謬作此思惟知不了教不可依了教可依復更思惟了教詮理不了教亦詮理故知理不定屬於言即能解義是可依語不可依以復思解執言局理此是想識不得依止亡言取理此是智慧則可依也此是通解之方次解別依通依說第一依即是別依通解下三即是通依依據前境所恃之法解據內情故有通依別依通解別解之異也第二依由未生解復為說依了義經莫依不了義經何等名為不了義經如七女經言如雀在瓶中羅縠覆其口縠穿雀飛去識神隨後走三乘究竟一切無常一切無我如斯非一皆經法不分明多生人惑如似識神隨走謂言常而隨後走也一切無常謂舉常果第一義空諸無為等皆是無常聞道三乘謂舉鏗然是定故知不了教多生人惑不足可依何等以為了教還翻上識神相續隨後走有為中無常三乘非究竟即是一乘如是真正能生人解是以可依即是別解第二依復能通上下依即是通解也亦即是別依通解上一下二即是通依也次解第三第三依人柄教定宗由未生解是以聖者移言易句依義莫依於語夫言生於不足不足則於無言因言以會理斯皆可依也即是別解第三通解上二下一通依如此也次解第四依人此人由故柄教定宗執迷不返是以聖教依亡相之智能備取理存得之識則不詣於理故勸依智莫依識第四依人即別解第四通解上三通別之依亦如此也更有一解說第一依時四人同解第一利根者通解下三第二根人依教但解第一不能探解下三第二人聞說第二依時三人同解第二也第二人探解下二下二人依教生解不能探解下二也說第三依時二人同解第三第三人探解下一第四依人由故不解復為說第四依時但為第四人如斯二解並應可存也依既有通別之解當在何處人若是外凡不能賞文尋理若是內凡以上神爽以高假文通理也解言三根性地以上第四人應在乾慧之末何以得知經無成判以人情卜量三根能探自非得理在懷安如此也第四人不能探解故知落在乾慧之末也驗依之人如此說依之人復在何處也應在四果以上堪為說依人此人永絕相心所簡入定知眾生機根出定稱機說法是故堪為師也維摩呵諸聲聞何不先當入定觀此人心故知入定能知也出定不達性地訖至世間第一法亦能說法化人但不免相心所簡隱其師名一向落在弟子位中也四依者名雖有四理實有八四白依四黑依四白因四黑因法是一白依了教是二白依了義是三白依智是四白依人是一黑依不了教二黑依語是三黑依識是四黑依何以名白因能生白解名之為白也能生黑解名之為黑也第一義空非是黑白能生白解名為白也智體是白復能生白解名之為白也復有一解相形白黑猶如輕重相形得有假名輕重名生故知有白黑也四白因四白依能生四解與後作因故名白因也四黑因者能生四惑名之為黑此惑復能與後惑作因故言四黑因也道理人亦有可依但不了教故但道法為四依也今經人亦有可依不可依法亦有可依不可依何以得知魔邪外道則不可依魔之所說法外道所說法亦不可依也四依真人則可依四依人所說真法則可依也四依所說真法亦可依此大乘經究竟了義之教會通四依人法通依也道言依人者勸依人以取法也涅槃經具明四依住前性地解行五恆行道大乘理中得八分實義以為第一依也從初住已上訖至七住以來六恆行道大乘理中得十二分義以為第二依從七住訖盡九住七恆行道大乘理中得十四分義以為第三依十住菩薩八恆行道大乘理中得十六分義以為第四依此經略但道二依下分別中明三受持也何等為二依一解十住菩薩大乘理中具足十六分義以為上依九地以還未具足十六分義束為下依也復有一解凡聖分判住前性地在凡位中以為下依初住以上訖於十住聖人位中束為上依也十地者離辨三忍以之為十三忍者信忍順忍無生法忍信忍者有其二義一者聞信二者證信聞信者淺行之徒未能自悟必須憑師藉教然後得解從初立名故言聞信也證信者始涉理照得會真寂驗先聞非虛故言證信也緣此二信以辨智故名信忍順忍者習行既久觀道調易內照冥符心無違逆故言順忍無生法忍者體鑒淵極會理喻深以境目智故言無生法忍尋此諸忍皆乘信順以會理一忍之中具應有三名而初信後無生者蓋因義用不同彰其明昧之別夫行行之體要應先信而後順觀照之方必先順而後理故始信中順末言無生也又云初解淺故藉信義彰次照稍深順義將顯終智極理無生事著故宜直言無生法忍忍有始終之殊行宜有淺深之異各於茲致三品之別信順二忍開以為六無生法忍分以為四下下之智斷無明之粗品又除三界之餘習雜治兩惑間智雙明制以為七地餘分為三合以成十一者歡喜地二者離垢地三明四炎五難勝六現前七遠行八不動九妙善十法雲歡喜者昔在凡地未夷三途常懷五怖既登聖位永絕生死之苦方趣無為之樂情忻所遇義云歡喜離垢者夫垢以塵障為能善以遣惡為用二地精修十善以去十惡之垢垢有三品斯地已滅其二從離多以立稱故曰離垢此據見惑為言非是終盡之謂明地者信忍之上窮十惡之原禪心內靜淵照外發故曰明地炎地者順忍之初斷思惟惑始究竟精進遍行道品慧鑒殊深逾前地之照猶室中之明未若燈中之炎故以為稱又云炎者上昇之義四地明勝有上昇之德故名為炎難勝者諦觀內周五明外被物我兼益下學人天所不能故曰難勝現前者順忍之上分段惑盡達觀因緣理照無滯常會三空如現在前遠行者德過二乘行出三界深會無生遠同法身高行故言遠行不動地者常在法流心冥大寂不動而應不慮而化止勞絕務識用俱滅故曰不動妙善者具足無礙妙於知機應病授藥物無不益妙於前善故曰妙善法雲者行圓照滿位居受職諸佛作雲雨之說無不領悟亦以所得之法作雲雨之益故稱法雲推此名者皆應互辨初地分身百佛化沾群品豈無慈悲並潤之事十地受職曾所未得寧無忻遇悅喜之情但義有隱顯故置名不同夫功深則利遠德薄則化淺從凡登聖難從聖習聖易初地始登其難而化益未深既乘其易功濟彌深欣遇義顯故立歡喜之名功濟事彰宜置法雲之稱初地不云離垢者夫善則心樂照淨則垢離見惑三品初地斷一以離苦二地除二以息惡離苦喜相事顯止惡則離垢義著初地曰歡喜二地名離垢也住者以人為名地以法為稱將明人住此地故言地故經言菩薩爾時名住歡喜地以不動法也故知人為住也七地以還所以得增道之稱八住以上得損生之名又二種解一解言七地以還但彰所得隱於所除八住以上但彰所除隱於所得互舉一相理自可知也又復解七住已還去大果遼遠生無邊畔不可制生為限是以得增道之稱八住以上鄰近大果生有邊畔可以局生為限故得損生之名如似小乘經中須陀洹果未斷見諦惑盡生無頭數不可制為六七亦斷見諦惑盡生有頭數可制為六七極鈍者至七生無漏智熟道成羅漢今此中亦爾也八住以上為當假教為不假教也一解七地以還假教增道八住以上一向不假於教云何聞如來壽命長遠道言聞者為物故聞理實不聞也更有一解皆有所假但假有所以七住以還有此三界報身一向假此音聲粗教以悟理八住以上法身菩薩不復假此粗教但有所不達恆作仰諮之意聖者冥心授法假聖冥益故道言假也實不假此粗教也若不假教云何聞如來壽命長遠也當此一坐時中假聖冥益義同於聞也又問損生者損何等生也若三界報生久已絕竟復不須損若應生者有感則應機盡則滅不與人為患復不須損也今言損者損何物生又一解三界外無漏中無常以之為生無漏為真智因得無常為不善因招今聞壽量常果損此惑因既盡不受無漏中無常損此無常故言損生也復有一解無漏中苦受以之為生無漏為前無漏因得苦受為不善因得雖復同體共住二因有別也今聞如來壽命長遠增其勝解斷此不善因盡不復受此無漏中苦受損此無漏中苦受故言損生也復有一種解八住以上猶有四陰報身此身何由而得正由出觀起習相善作因習無明緣潤感得四陰報以之為生今聞說壽量增其勝解斷此緣潤既盡習相業燋不復受此四陰報生故言損生也又問八住以上若習相善業作因習無明緣潤感得四陰以為生者勝鬘經中云何無漏業作因無明為緣感得阿羅漢大力菩薩三種意生身也又解無漏不感生死道言無漏業為因習相善業從前無漏後起相從故道言無漏作因其實習相善業作因也又問若八住以上由故造習相善業感四陰者經云何道言聖人畢故不造新業也又解三界報粗故用凡夫時故業受生更不須造業而得八住以上四陰報精更須造業而得也經言畢故不造新者不造三界業也又問若三界報粗更不須造業而得者云何涅槃經中是法報得色界五陰燸頂法中造禪定業受上地報也又解經師解義不同一解言性地以上聖人不復造業此人在外凡夫時造取相定業感上地報今來入性地修習無漏燸頂法中出空觀無漏還入凡夫時取相定之種類故言是法報得色界五陰也復有一解燸頂法中出空觀無漏造別報定業招上地色界五陰中樂受報故言是法報得色界五陰也經言道聖人畢故不造新者不造總報業也造別報業有何傷也更有一解燸心後造禪定業受上地報也他人又問燸心後造定業受上地身者斷上二界內凡惑盡欲界思惟煩惱未斷一毫還牽來欲界受生聖人但論上進不言下生今為惑牽生豈非枉聖退生又解但使燸頂法中用定業受上地生者其必入空觀要斷上二界內凡惑盡斷欲界思惟惑盡然後出觀若不斷盡終不出觀作勢極解也若爾欲界無惑云何牽生也若寧馨解時經道聖人畢故不造新者無相以上聖人用凡夫時故業受生更不造新也世間第一法以前是內凡夫非是聖人得造業招生也又問八住以上若當出觀起惑云何經言八住以上入法流水中念念常淨也又解經言法流水中常淨者此是從多之謂也入觀情多出觀情少故道言念念常淨亦有出觀時也如小乘經中道羅漢一切時空心中行者可萇在空心中行亦有出觀時也又問八住以上猶有四陰報身者三界中無色界亦有四陰報身等是四陰無差云何三界外得變易名三界中與分段稱也又解等是四陰無異精粗有殊三界四陰報粗得其分段之名三界外四陰報精與變易之稱也更有一解正指無漏為生也經言無漏業為正因無明為緣感得變易身以之為生八住以上生乃無量略舉其對一地中相似無漏粗者域作三生三地中有其九生也八住中有入地行心住地行心有滿地行心域此三種心作其三生乃至九住十住皆如此也惑亦域作九品還潤九生今言潤生用何等惑潤七住菩薩起三種愛心八住以上不復起惑八住地中上品惑潤下品無漏何以上品惑潤下品生惑本從粗至細解本從微至著是以上品煩惱潤下品生也夫為解法捨下趣中捨中趣上既至金剛次第增進無漏相續而生正由上品習惑因果不斷故潤下品無漏種類恆相續而生有彼惑故下品無漏恆生故言潤生也不如三界中逕心起愛故潤生也言損生者先斷上品惑因果應盡今聞如來壽命長遠增其勝解斷上品惑盡使下品無漏種類不復相續生中品勝進無漏得生有如此義故道言損生也解一品既爾乃至九品皆如此損無異也又問若損上品惑盡使下品無漏種類不復生者若爾此便斷無漏與闡提何異又解不斷無漏下品無漏中有二因有與下品同種類作因有與中品無漏作因今聞常增解下品中因不感中品果不赴如君所難可斷無漏同於闡提今聞常住更生勝解斷上品習惑因果既盡下品因速感中品果速赴乃更有勝進無漏流來在現云何損無漏不損無漏也何以得知小乘經中未斷見諦惑盡時須陀洹果前下品見諦無漏恆相續而生亦斷惑盡滅須陀洹果修道中勝進生時須陀洹果前下品無漏不復生得言損無漏不若言須陀洹果前下品無漏不生道言損者我今下品種類無漏不生故道言損也竟有何傷也而言修道中更有勝進解生不得言損無漏我今更有中品解生云何損無漏也雖復大小乘經別所斷無異也損時共損不損共不損也又問若不損無漏云何名損生又解損潤生之惑故言損生也實不損無漏也何以得知勝鬘經言有餘生法不盡故有生三界外恆沙無明是潤生之法正由不斷三界外習惑無明故更須受變易生身以此驗知損潤生惑也前之三種餘法師所辨最後一解經師所存未量是非隨情消息便者用也錄文完
